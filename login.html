<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GameZone | Login</title>
    <link rel="icon" type="image/png" href="assets/img/logo_sin_letras.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark navbar-gamezone">
        <div class="container navbar-contenido">
          <!-- A la izquierda -->
          <div class="navbar-izquierda">
            <a class="nav-link active" href="index.html">Inicio</a>
          </div>

          <!-- Centro -->
          <a
            class="navbar-brand d-flex align-items-center navbar-logo"
            href="index.html"
          >
            <img
              src="assets/img/gamezone_letras.png"
              alt="GameZone"
              class="logo-letras"
            />
          </a>

          <!-- Botón para celular -->
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal"
            aria-expanded="false"
            aria-label="Abrir menú"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- A la derecha -->
          <div
            class="collapse navbar-collapse navbar-derecha"
            id="menuPrincipal"
          >
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="registro.html"> Registrarse </a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="login.html"> Iniciar sesión </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <footer class="footer-gamezone">
      <div class="container text-center">
        <p class="mb-1">© 2026 GameZone. Todos los derechos reservados.</p>

        <p class="mb-0">Desarrollo Full Stack II</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
