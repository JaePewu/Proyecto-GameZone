<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GZ | Registro</title>
    <link rel="icon" type="image/png" href="assets/img/logo_sin_letras.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js" defer></script>
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark navbar-gamezone">
        <div class="container navbar-contenido">
          <!-- Izquierda -->
          <div class="navbar-izquierda">
            <a class="nav-link" href="index.html">Inicio</a>
          </div>

          <!-- Centro -->
          <a
            class="navbar-brand d-flex align-items-center navbar-logo"
            href="index.html"
          >
            <img
              src="assets/img/gamezone_letras.png"
              alt="GameZone"
              class="logo-letras"
            />
          </a>

          <!-- Botón para celular -->
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal"
            aria-expanded="false"
            aria-label="Abrir menú"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Derecha -->
          <div
            class="collapse navbar-collapse navbar-derecha"
            id="menuPrincipal"
          >
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" href="registro.html">
                  Registrarse
                </a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="login.html"> Iniciar sesión </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="formulario-principal">
      <section class="seccion-formulario">
        <div class="container">
          <div class="contenedor-formulario">
            <h1>Crear cuenta</h1>

            <p class="texto-formulario">
              Regístrate en GameZone y comienza tu próxima aventura.
            </p>

            <form id="formularioRegistro">
              <!-- Nombre completo -->
              <div class="mb-3">
                <label for="nombre" class="form-label"> Nombre completo </label>

                <input
                  type="text"
                  class="form-control"
                  id="nombre"
                  name="nombre"
                  maxlength="100"
                  autocomplete="name"
                />

                <p class="mensaje-error" id="errorNombre"></p>
              </div>

              <!-- Correo electrónico -->
              <div class="mb-3">
                <label for="correo" class="form-label">
                  Correo electrónico
                </label>

                <input
                  type="email"
                  class="form-control"
                  id="correo"
                  name="correo"
                  maxlength="60"
                  autocomplete="email"
                  placeholder="usuario@duoc.cl"
                />

                <p class="mensaje-error" id="errorCorreo"></p>
              </div>

              <!-- Contraseña -->
              <div class="mb-3">
                <label for="contrasena" class="form-label"> Contraseña </label>

                <input
                  type="password"
                  class="form-control"
                  id="contrasena"
                  name="contrasena"
                  autocomplete="new-password"
                />

                <p class="mensaje-error" id="errorContrasena"></p>
              </div>

              <!-- Confirmar contraseña -->
              <div class="mb-3">
                <label for="confirmarContrasena" class="form-label">
                  Confirmar contraseña
                </label>

                <input
                  type="password"
                  class="form-control"
                  id="confirmarContrasena"
                  name="confirmarContrasena"
                  autocomplete="new-password"
                />

                <p class="mensaje-error" id="errorConfirmarContrasena"></p>
              </div>

              <!-- Teléfono -->
              <div class="mb-3">
                <label for="telefono" class="form-label">
                  Teléfono
                  <span class="texto-opcional">(opcional)</span>
                </label>

                <input
                  type="tel"
                  class="form-control"
                  id="telefono"
                  name="telefono"
                  autocomplete="tel"
                />

                <p class="mensaje-error" id="errorTelefono"></p>
              </div>

              <!-- Géneros favoritos -->
              <fieldset class="mb-4">
                <legend class="form-label">Géneros favoritos</legend>

                <div class="generos-registro">
                  <div class="form-check">
                    <input
                      class="form-check-input genero"
                      type="checkbox"
                      value="Ficcion"
                      id="ficcion"
                    />
                    <label class="form-check-label" for="ficcion">
                      Ficción
                    </label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input genero"
                      type="checkbox"
                      value="No Ficcion"
                      id="noFiccion"
                    />
                    <label class="form-check-label" for="noFiccion">
                      No ficción
                    </label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input genero"
                      type="checkbox"
                      value="Misterio"
                      id="misterio"
                    />
                    <label class="form-check-label" for="misterio">
                      Misterio
                    </label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input genero"
                      type="checkbox"
                      value="Terror"
                      id="terror"
                    />
                    <label class="form-check-label" for="terror">
                      Terror
                    </label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input genero"
                      type="checkbox"
                      value="Suspenso"
                      id="suspenso"
                    />
                    <label class="form-check-label" for="suspenso">
                      Suspenso
                    </label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input genero"
                      type="checkbox"
                      value="Historia"
                      id="historia"
                    />
                    <label class="form-check-label" for="historia">
                      Historia
                    </label>
                  </div>
                </div>

                <p class="mensaje-error" id="errorGeneros"></p>
              </fieldset>

              <!-- Botón -->
              <button type="submit" class="btn btn-gamezone w-100">
                Crear cuenta
              </button>
            </form>

            <p class="enlace-formulario">
              ¿Ya tienes una cuenta?
              <a href="login.html">Inicia sesión</a>
            </p>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer-gamezone">
      <div class="container text-center">
        <p class="mb-1">© 2026 GameZone. Todos los derechos reservados.</p>

        <p class="mb-0">Desarrollo Full Stack II</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
